name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22']
    steps:
      # Third-party actions are pinned to a commit; the comment names the release it belongs to.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (pnpm version from package.json's packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      # The DeepSeek Harness container tests skip themselves on a Node without zstd (the product feature-detects it); CI
      # must run them, so a runner Node without node:zlib zstd fails here instead of passing with them skipped.
      - name: Node has node:zlib zstd (DeepSeek tests must run)
        shell: bash
        run: |
          node -e "if (typeof require('node:zlib').zstdDecompressSync !== 'function') { console.error('CI needs a Node with node:zlib zstdDecompressSync (22.15 or later): ' + process.version + ' has none, so the DeepSeek Harness tests would be skipped'); process.exit(1) } console.log('node:zlib zstd present on ' + process.version)"
      - run: pnpm test
        env:
          # Wall-clock bounds measured on a developer machine, scaled for a shared runner (pipeline.timing.test.ts).
          AGENT_CANVAS_TIMING_SCALE: '3'
      # The package as it would be published: assembled, then run from a temp directory (see scripts/check-release.mjs).
      - run: node scripts/pack.mjs
      - run: node scripts/check-release.mjs
